name: Garson Bot (İçerik Servis Edici)

on:
  schedule:
    # Her 6 saatte bir çalışarak (Aşçı Bot'tan 15 dk sonra) daily_output klasörünü src/content/posts klasörüne aktarır.
    - cron: '45 */6 * * *'
  workflow_dispatch: # Manuel tetikleme (Kullanıcının isteği)

# Çakışma Önleyici & Sıralı Bekleme Kuyruğu Kalkanı
concurrency:
  group: logiccompare-pipeline
  cancel-in-progress: false

jobs:
  serve-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Garson Bot'u Çalıştır (İçerik Taşıma ve Senkronizasyon)
        run: node scripts/garson.mjs

      - name: Güncellenen İçerikleri Depoya Kaydet (Push)
        run: |
          git config --global user.name "GarsonBot"
          git config --global user.email "garsonbot@logiccompare.com"
          git fetch origin main
          git add -A
          git commit -m "feat: Garson Bot daily_output içeriklerini src/content/posts klasörüne aktardı" || echo "Aktarılacak içerik yok"
          
          # Çakışma Önleyici Akıllı Rebase & Otomatik Çözüm
          for i in {1..3}; do
            git pull --rebase -X theirs origin main && break || {
              echo "Çakışma algılandı, otomatik çözülüyor..."
              git rebase --abort || true
              git fetch origin main
              git merge -X ours origin/main -m "merge: otomatik çakışma çözüldü"
              break
            }
          done
          
          git push origin main || (git pull --rebase -X theirs origin main && git push origin main)
