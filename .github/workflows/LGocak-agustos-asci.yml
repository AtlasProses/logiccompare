name: Ocak - Ağustos Aşçı Botu (3 Saatlik Otomatik Üretim & Garson)

on:
  schedule:
    # Her 3 saatte bir çalışarak (günde 8 defa) havuzdan konuları çekip 30'ar makale yazar.
    - cron: '0 */3 * * *'
  workflow_dispatch: # Manuel tetikleme seçeneği

# Çakışma Önleyici & Sıralı Bekleme Kuyruğu Kalkanı
concurrency:
  group: logiccompare-pipeline
  cancel-in-progress: false

jobs:
  cook-and-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    
    steps:
      - name: "Repoyu Klonla"
        uses: actions/checkout@v4

      - name: "Node.js Kurulumu"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Bağımlılıkları Yükle"
        run: npm install

      - name: "Ocak - Ağustos Aşçı Botunu Çalıştır (Hedef 30 Makale)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINIESKI_API_KEY: ${{ secrets.GEMINIESKI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: node scripts/ocak-agustos-asci-bot.mjs --target=30

      - name: "Garson Bot'u Çalıştır (Doğrulama ve src/content/posts Aktarımı)"
        run: node scripts/garson.mjs

      - name: "Yeni Makaleleri ve Güncel Havuzu Depoya Kaydet"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git add -A
          git commit -m "feat(bot): Ocak-Ağustos Aşçı Botu yeni makaleler pişirdi ve siteye aktardı" || echo "Değişiklik yok"
          
          # Çakışma Önleyici Akıllı Rebase & Otomatik Çözüm
          for i in {1..3}; do
            git pull --rebase -X theirs origin main && break || {
              echo "Çakışma algılandı, otomatik çözülüyor..."
              git rebase --abort || true
              git fetch origin main
              git merge -X ours origin/main -m "merge: otomatik çakışma çözüldü"
              break
            }
          done
          
          git push origin main || (git pull --rebase -X theirs origin main && git push origin main)

