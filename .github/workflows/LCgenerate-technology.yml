name: Generate Technology Content

on:
  schedule:
    - cron: '15 6,18 * * *' # Her 12 saate bir (NVIDIA API entegrasyonu için günde 48 yayın)
  workflow_dispatch: # Manuel tetiklemeye izin verir

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install --no-package-lock --legacy-peer-deps
        
      - name: Generate Technology Article
        run: node scripts/generate-technology.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "PlateAndProse Bot"
          git config --global user.email "admin@plateandprose.com"
          git add .
          git commit -m "Otomatik Technology icerik ve yarn.lock guncellemesi" || echo "No changes to commit"
          git pull --rebase origin ${GITHUB_REF#refs/heads/}
          git push origin ${GITHUB_REF#refs/heads/}

      - name: Trigger Cloudflare Deployment
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -X POST "${{ env.DEPLOY_HOOK_URL }}"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
