name: 4 Kategorili Zombi Avcı Botları (Scraper)

on:
  schedule:
    # Her gün gece 02:00'da tetiklenir (Fakat rastgele uyku ile uyanacak)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Rastgele Uyanma (İnsan Taklidi)
        run: |
          # 0 ile 1 dakika (60 saniye) arası rastgele bir mola (Test modunda)
          sleep_time=$((RANDOM % 60))
          echo "Bot uyandırıldı fakat dikkat çekmemek için $sleep_time saniye (yaklaşık $((sleep_time / 60)) dakika) yatakta keyif yapıyor..."
          sleep $sleep_time
          echo "Bot yataktan kalktı ve işe koyuldu!"

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: 1. Avcı Bot (Tech) - HackerNews & Semantic Scholar
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: node scripts/LGscraper_Tech.js

      - name: 2. Avcı Bot (Finance) - Reddit WallStreetBets vs
        run: node scripts/LGscraper_Finance.js

      - name: 3. Avcı Bot (Sports) - Reddit Sports
        run: node scripts/LGscraper_Sports.js

      - name: 4. Avcı Bot (Gaming) - RAWG & SteamSpy
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: node scripts/LGscraper_Gaming.js

      - name: Çekilen Verileri ve Varsa Hata Loglarını GitHub'a Kaydet
        run: |
          git config --global user.name "ZombiBot"
          git config --global user.email "zombibot@testdeposu.com"
          git add -A
          git commit -m "Zombi Avcı Botlar (Tech, Fin, Spo, Gam) Havuzu (raw_data_pool) Güncelledi" || echo "Değişiklik yok"
          git pull --rebase
          git push
