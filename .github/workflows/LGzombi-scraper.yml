name: 🧟 Elit 2000+ Avcı Botları (Zero-Junk Trend Scrapers)

on:
  schedule:
    # Her 3 saatte bir otomatik arka planda uyanır
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Hedeflenen Toplam Veri Sayısı'
        required: true
        default: '2000'
        type: string
      category:
        description: 'Kategori Seçimi (all, tech, finance, gaming, sports)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - tech
          - finance
          - gaming
          - sports

jobs:
  hunt-and-enrich-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Elit Avcı Botları Çalıştır (2025-2027 Trend & Sıfır Çöp Filtresi)
        run: |
          TARGET="${{ inputs.target || '2000' }}"
          CATEGORY="${{ inputs.category || 'all' }}"
          node scripts/run_all_hunters.mjs --target=$TARGET --cat=$CATEGORY

      - name: Çekilen Altın Verileri GitHub'a Kaydet ve Push Et
        run: |
          git config --global user.name "ZombiAvciBot"
          git config --global user.email "bot@logiccompare.com"
          git add raw_data_pool.json scraped_history.json
          git commit -m "feat(pool): Elit Avcı Botlar havuzu 2000+ trend veriyle güncelledi" || echo "Yeni veri eklenmedi"
          git pull --rebase origin main
          git push origin main
